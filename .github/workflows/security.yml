name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # ZAP API complet la nuit
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install bandit ruff
      - name: Ruff security rules
        run: ruff check --select S .
      - name: Bandit (bloque HIGH)
        run: bandit -r minishop -ll -f txt
      - name: Bandit SARIF
        if: always()
        run: |
          bandit -r minishop -f sarif -o bandit.sarif || true
      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif

  sca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit
      - name: pip-audit (CVE dépendances)
        run: pip-audit -r requirements.txt

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t minishop:ci .
      - name: Trivy HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: minishop:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table
      - name: SBOM CycloneDX
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: minishop:ci
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: ignore

  zap-baseline:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Démarrer MiniShop
        run: |
          uvicorn minishop.api:app --host 127.0.0.1 --port 8000 &
          timeout 30 bash -c 'until curl -sf localhost:8000/health; do sleep 1; done'
      - name: OWASP ZAP baseline
        run: |
          mkdir -p zap
          cp security/zap-rules.tsv zap/
          chmod 777 zap
          docker run --rm --network host -v "$PWD/zap":/zap/wrk ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8000 -c zap-rules.tsv -r zap-report.html \
            || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: zap/
          if-no-files-found: ignore

  zap-api-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Démarrer MiniShop
        run: |
          uvicorn minishop.api:app --host 127.0.0.1 --port 8000 &
          timeout 30 bash -c 'until curl -sf localhost:8000/health; do sleep 1; done'
      - name: OWASP ZAP API scan
        run: |
          mkdir -p zap
          docker run --rm --network host -v "$PWD/zap":/zap/wrk ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://127.0.0.1:8000/openapi.json -f openapi -r zap-api-report.html \
            || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-api-report
          path: zap/
          if-no-files-found: ignore
