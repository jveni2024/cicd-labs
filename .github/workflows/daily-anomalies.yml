name: Daily anomalies

on:
  schedule:
    # Tous les jours à 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Simuler un historique JUnit / logs
        run: python scripts/simulate_history.py
      - name: Analyser l'historique des tests
        env:
          LLM_PROVIDER: anthropic
          LLM_MODEL: claude-haiku-5-5
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p reports
          python ai_tools/test_history.py data/junit-history --explain --report reports/test-insights.md
          {
            echo "## Analyse quotidienne des tests"
            echo
            cat reports/test-insights.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Détecter les anomalies dans les logs
        run: |
          python ai_tools/log_anomalies.py data/app-logs.jsonl --window 30 --contamination 0.02
          {
            echo
            echo "## Anomalies logs"
            echo
            cat reports/anomalies.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publier les rapports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-anomaly-reports
          path: reports/
          if-no-files-found: ignore
